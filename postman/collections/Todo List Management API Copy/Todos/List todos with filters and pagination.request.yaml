$kind: http-request
url: "{{baseUrl}}/api/v1/todos?page=1&limit=20&sortBy=created_at&order=desc&search=API&completed=false&category={{categoryId}}"
method: GET
queryParams:
  page: "1"
  limit: "20"
  sortBy: created_at
  order: desc
  search: API
  completed: "false"
  category: "{{categoryId}}"
auth:
  type: bearer
  credentials:
    token: "{{jwt}}"
order: 1000
